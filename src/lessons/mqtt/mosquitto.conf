# Broker of the solar plant (made up, for Mosquitto 2)

# Every client logs in and may use only its own topics
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Inside the plant network only: plain MQTT
listener 1883 10.20.0.2

# For clients from outside: MQTT over TLS
listener 8883
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/broker.crt
keyfile /etc/mosquitto/certs/broker.key

# Keep retained messages and sessions across a restart
persistence true
persistence_location /var/lib/mosquitto/
